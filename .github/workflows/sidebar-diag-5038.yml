name: Sidebar diagnostics (#5038)

# Temporary fork-only workflow: runs the opt-in @SIDEBAR_DIAG scenarios from
# OrchestratorInc/agent-orchestrator#6053 in the same pinned container, Node
# version, and install steps as Frontend / renderer-smoke. Not part of the PR.

on:
  push:
    branches: [ci/sidebar-diag-5038]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidebar-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Typecheck e2e suite
        run: npm run typecheck:e2e

      - name: Run sidebar diagnostics
        run: AO_SIDEBAR_DIAG=1 CI=true npx playwright test e2e/sidebar-missing-worker-diagnostic.spec.ts --grep @SIDEBAR_DIAG --workers=1 --reporter=list
